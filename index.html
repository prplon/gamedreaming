<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { revealed: false };
  address() {
    const user = ['o', 'l', 'l', 'e', 'h'].reverse().join('');
    const host = ['gamedreaming', 'com'].join('.');
    return user + String.fromCharCode(64) + host;
  }
  renderVals() {
    const addr = this.address();
    return {
      mailHref: this.state.revealed ? 'mailto:' + addr : '#',
      mailLabel: this.state.revealed ? addr.toUpperCase() : 'CONTACT',
      onContact: (e) => {
        if (this.state.revealed) return;
        e.preventDefault();
        this.setState({ revealed: true });
        window.setTimeout(() => { window.location.href = 'mailto:' + addr; }, 60);
      }
    };
  }
}
</script>
